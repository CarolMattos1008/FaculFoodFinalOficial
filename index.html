<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b2a4a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FaculFood" />
<meta name="description" content="FaculFood — peça no campus da PUC-Rio e retire no balcão." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<title>FaculFood — Pedidos para retirada</title>
<style>
  :root{
    --bg:#fbf6f2; --surface:#ffffff; --surface-2:#f3ebe3; --line:#e8ded3;
    --text:#1b2a4a; --muted:#7a746c; --brand:#f5a623; --brand-d:#e0921a; --navy:#1b2a4a;
    --ok:#2fa564; --warn:#d9962a; --danger:#d64545; --wa:#25d366; --radius:16px;
    --appw:1120px; --tabh:64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#efe6dc; color:var(--text);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  button{font:inherit; cursor:pointer}
  /* ---------- casca de app: coluna central com cara de celular ---------- */
  .shell{max-width:var(--appw); margin:0 auto; min-height:100vh; background:var(--bg); position:relative}
  @media(min-width:1140px){ .shell{box-shadow:0 0 0 1px var(--line)} }
  .wrap{padding:4px 16px calc(var(--tabh) + 96px)}
  @media(min-width:760px){ .wrap{padding-left:28px; padding-right:28px} }
  .narrow{max-width:520px; margin-left:auto; margin-right:auto}
  .wrap.notabs{padding-bottom:40px}
  header.appbar{
    position:sticky; top:0; z-index:20; background:rgba(251,246,242,.94);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px; display:flex; align-items:center; gap:8px; min-height:56px
  }
  .logo{font-weight:800; letter-spacing:.3px; font-size:18px; display:flex; align-items:center; gap:8px}
  .logo img{height:30px; width:auto; display:block; border-radius:8px}
  .apptitle{font-weight:800; font-size:17px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .iconbtn{width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text);
    font-size:18px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; position:relative; flex:none}
  .iconbtn:disabled{opacity:.3; cursor:default}
  .badge{position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff; border-radius:999px; min-width:18px; height:18px;
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 4px; line-height:1}
  .badge.brand{background:var(--brand); color:#3d2c00}
  /* barra de abas inferior */
  nav.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(var(--appw),100%); z-index:30;
    background:var(--surface); border-top:1px solid var(--line); display:flex; padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  nav.tabbar button{flex:1; border:0; background:none; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:6px 2px; font-size:11px; font-weight:700; border-radius:12px; position:relative}
  nav.tabbar button .ic{font-size:21px; line-height:1.1; filter:grayscale(1); opacity:.7}
  nav.tabbar button.on{color:var(--navy)}
  nav.tabbar button.on .ic{filter:none; opacity:1}
  nav.tabbar button.on::after{content:""; position:absolute; top:0; width:28px; height:3px; border-radius:0 0 3px 3px; background:var(--brand)}
  nav.tabbar .badge{top:0; right:calc(50% - 22px)}
  /* carrinho flutuante acima das abas */
  .cartbar{position:fixed; left:50%; transform:translateX(-50%); width:min(calc(var(--appw) - 24px), calc(100% - 24px)); z-index:29;
    bottom:calc(var(--tabh) + 10px + env(safe-area-inset-bottom,0px)); background:var(--navy); color:#fff; border-radius:16px;
    box-shadow:0 8px 24px rgba(27,42,74,.3); padding:10px 10px 10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; border:0; font-weight:600; text-align:left}
  .cartbar b{color:var(--brand)}
  .btn{
    border:1px solid var(--line); background:var(--surface-2); color:var(--text);
    padding:10px 16px; border-radius:12px; font-weight:700; box-shadow:0 1px 2px rgba(27,42,74,.04); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px
  }
  .btn:hover{border-color:#d3c6b6}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#3d2c00}
  .btn.primary:hover{background:var(--brand-d); border-color:var(--brand-d)}
  .btn.navy{background:var(--navy); border-color:var(--navy); color:#fff}
  .btn.wa{background:var(--wa); border-color:var(--wa); color:#063b1c}
  .btn.danger{background:#fdeceb; border-color:#f2c4c2; color:#9c2f2c}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px; font-size:13px; border-radius:10px}
  .btn.lg{padding:14px 18px; font-size:16px; border-radius:14px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px;
    background:var(--surface-2); border:1px solid var(--line); font-size:12px; color:var(--muted)}
  h1{font-size:22px; margin:18px 0 4px; line-height:1.25}
  h2{font-size:17px; margin:24px 0 10px}
  .sub{color:var(--muted); margin:0 0 8px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:0 1px 3px rgba(27,42,74,.05)}
  .grid{display:grid; gap:12px}
  .grid.cols{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .rest-card{cursor:pointer; transition:border-color .15s, transform .05s}
  .rest-card:hover{border-color:var(--brand)}
  .rest-card:active{transform:scale(.99)}
  .rest-emoji{font-size:30px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .xs{font-size:12px}
  .row{display:flex; align-items:center; gap:10px}
  .wrapx{flex-wrap:wrap}
  .between{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .price{font-weight:800; white-space:nowrap}
  .item{padding:12px 0; border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .field{display:block; margin:12px 0}
  .field label, .lbl{display:block; font-size:13px; color:var(--muted); margin-bottom:5px; font-weight:600}
  .field input, .field select, .field textarea, input.inp{
    width:100%; padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font:inherit; font-size:16px
  }
  .field textarea{min-height:110px; resize:vertical}
  .field input:focus, .field select:focus, .field textarea:focus, input.inp:focus{outline:2px solid var(--brand); outline-offset:0; border-color:transparent}
  .field .hint{font-size:12px; color:var(--muted); margin-top:4px}
  .check{display:flex; gap:10px; align-items:flex-start; margin:10px 0; font-size:14px}
  .check input{width:20px; height:20px; margin-top:1px; accent-color:var(--brand-d)}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .notice{border-radius:12px; padding:10px 12px; font-size:13px; margin:10px 0}
  .notice.info{background:#e9f1fd; border:1px solid #bcd4f6; color:#1c3d7a}
  .notice.warn{background:#fdf3e1; border:1px solid #ead0a0; color:#7a5a1a}
  .notice.ok{background:#e7f6ed; border:1px solid #b4e1c5; color:#1d6b41}
  .notice.err{background:#fdeceb; border:1px solid #f2c4c2; color:#9c2f2c}
  .seg{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:14px; margin:12px 0}
  .seg button{flex:1; border:0; background:transparent; padding:9px 8px; border-radius:10px; font-weight:700; color:var(--muted)}
  .seg button.on{background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(27,42,74,.1)}
  /* seletor de quantidade: começa em 0 (botão +) e vira − n + */
  .qty{display:inline-flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden}
  .qty button{width:34px; height:34px; border:0; background:transparent; color:var(--text); font-weight:800; font-size:18px}
  .qty button:disabled{opacity:.3}
  .qty span{min-width:26px; text-align:center; font-weight:800}
  .addbtn{width:36px; height:36px; border-radius:12px; border:0; background:var(--brand); color:#3d2c00; font-size:22px; font-weight:800; line-height:1; flex:none}
  .addbtn:disabled{background:var(--surface-2); color:var(--muted)}
  .code-badge{font-size:30px; font-weight:800; letter-spacing:4px; color:var(--brand-d)}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0}
  .total-line{font-size:18px; font-weight:800}
  .pix-qr{width:220px; height:220px; background:#fff; border-radius:12px; padding:8px; margin:8px auto; display:block; border:1px solid var(--line)}
  .pay-opt{display:flex; gap:10px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:12px; margin:8px 0; cursor:pointer}
  .pay-opt.active{border-color:var(--brand); background:#fff7ea}
  .pay-opt.off{opacity:.5; cursor:not-allowed}
  .pay-opt input{margin-top:3px; accent-color:var(--brand-d)}
  .status-tag{font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap}
  /* cores de status: cinza não confirmado · vermelho na fila · amarelo em preparo · verde pronto */
  :root{ --c-aguardando:#8a929c; --c-fila:#d64545; --c-preparando:#e0a800; --c-pronto:#2fa564; --c-retirado:#b8b0a6 }
  .st-aguardando{background:#eceff2; color:#4b5563}
  .st-fila{background:#fdeaea; color:#b42323}
  .st-preparando{background:#fff4c7; color:#7a5b00}
  .st-pronto{background:#e3f6ea; color:#17683b}
  .dot{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:6px; vertical-align:middle}
  .kcard.s-aguardando{border-left:5px solid var(--c-aguardando)} .kcard.s-fila{border-left:5px solid var(--c-fila)}
  .kcard.s-preparando{border-left:5px solid var(--c-preparando)} .kcard.s-pronto{border-left:5px solid var(--c-pronto)}
  .kcard.s-retirado{border-left:5px solid var(--c-retirado)}
  .kcol.c-aguardando h3{color:#4b5563} .kcol.c-fila h3{color:#b42323} .kcol.c-preparando h3{color:#7a5b00} .kcol.c-pronto h3{color:#17683b}
  .kcol.c-aguardando{background:#f1f2f4} .kcol.c-fila{background:#fdf1f1} .kcol.c-preparando{background:#fff9e3} .kcol.c-pronto{background:#eef9f2}
  /* perfil em uso (cor da barra superior) */
  header.appbar.r-cliente{border-bottom:3px solid var(--brand)} header.appbar.r-restaurante{border-bottom:3px solid #2f8f5b} header.appbar.r-puc{border-bottom:3px solid #6b4fbb}
  .rolebadge{border:0; border-radius:999px; padding:7px 12px; font-weight:800; font-size:13px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
  .rolebadge.r-cliente{background:#fff1d6; color:#7a4f00} .rolebadge.r-restaurante{background:#e3f4ea; color:#1d6b41} .rolebadge.r-puc{background:#efe9fb; color:#4b2f8f}
  .menu{position:absolute; right:12px; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 32px rgba(27,42,74,.18); min-width:230px; padding:6px; z-index:60}
  .menu .who{padding:10px 12px; border-bottom:1px solid var(--line); margin-bottom:4px}
  .menu button{display:flex; width:100%; gap:10px; align-items:center; border:0; background:none; padding:11px 12px; border-radius:10px; font-weight:600; text-align:left; color:var(--text)}
  .menu button:hover{background:var(--surface-2)}
  /* pedido em andamento: pílula flutuante acima das abas */
  .orderpill{position:fixed; left:50%; transform:translateX(-50%); width:min(calc(var(--appw) - 24px), calc(100% - 24px)); max-width:520px; z-index:28;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(27,42,74,.18); padding:10px 14px;
    display:flex; align-items:center; gap:10px; font-weight:700; text-align:left; font-size:14px}
  /* alarme de pedido pronto em tela cheia */
  .alarme-full{position:fixed; inset:0; z-index:80; background:rgba(23,104,59,.96); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px}
  .alarme-full .sino{font-size:96px; animation:balanca .6s infinite}
  .alarme-full h1{color:#fff; font-size:30px; margin:10px 0 4px}
  .alarme-full .cod{font-size:44px; font-weight:800; letter-spacing:6px; background:#fff; color:#17683b; border-radius:16px; padding:6px 18px; margin:14px 0}
  .alarme-full .btn{min-width:220px; margin-top:10px}
  .st-retirado{background:var(--surface-2); color:var(--muted)}
  .st-cancelado{background:#fdeceb; color:#9c2f2c}
  .pay-pend{background:#fdf3e1; color:#7a5a1a}
  .pay-ok{background:#e7f6ed; color:#1d6b41}
  .empty{text-align:center; color:var(--muted); padding:36px 0}
  footer.legal{padding:18px 4px 0; color:#94897c; font-size:12px}
  /* busca por desejo, promoções, avaliações */
  .ask-card{margin-top:14px; border:0; background:linear-gradient(160deg,var(--navy),#2c4170); color:#fff}
  .ask-card h1{margin:0 0 4px; font-size:clamp(20px,6.5vw,26px); color:#fff; white-space:nowrap}
  .ask-card .sub{color:#c9d3e6}
  .ask-form{display:flex; gap:8px; margin:12px 0 10px}
  .ask-form input{flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font:inherit; font-size:16px}
  .ask-form input:focus{outline:2px solid var(--brand); outline-offset:0; border-color:transparent}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chips.one-line{flex-wrap:nowrap; overflow:hidden}
  .chips.one-line .chip{white-space:nowrap; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
  button.chip{cursor:pointer; font-weight:600}
  button.chip:hover{border-color:var(--brand)}
  button.chip.on{background:var(--brand); border-color:var(--brand); color:#3d2c00}
  .ask-card button.chip{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); color:#fff}
  .chip.promo{background:var(--brand-d); border-color:var(--brand-d); color:#fff; font-weight:700}
  .chip.match{background:#e7f6ed; border-color:#b4e1c5; color:#1d6b41; font-weight:700}
  .chip.low{background:#fdf3e1; border-color:#ead0a0; color:#7a5a1a}
  .chip.ia{background:#efe9fb; border-color:#d9cdf5; color:#4b2f8f; font-weight:700}
  .chip.wa{background:#e3f9ec; border-color:#a9e8c3; color:#0d6b35; font-weight:700}
  .stars{color:var(--brand-d); font-weight:700}
  s.old{color:var(--muted); font-weight:500; font-size:13px; margin-left:4px}
  .card.is-promo{border-color:var(--brand)}
  /* grade de itens: nunca corta — 2 colunas no celular, mais colunas em telas maiores */
  .igrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  @media(min-width:600px){ .igrid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px} }
  @media(min-width:1000px){ .igrid{grid-template-columns:repeat(6,minmax(0,1fr))} }
  .rgrid{display:grid; grid-template-columns:1fr; gap:10px}
  @media(min-width:760px){ .rgrid{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))} }
  .thumb{height:92px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:46px; margin:-4px -4px 4px; position:relative}
  .thumb .chip{position:absolute; top:6px; left:6px}
  .clamp2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .icard{display:grid; gap:4px; align-content:start; padding:12px}
  .icard .name{font-weight:700; line-height:1.25}
  .icard .foot{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:auto; padding-top:4px; flex-wrap:wrap}
  .icard{grid-template-rows:auto auto auto auto 1fr}
  /* conversas (busca, IA e chat com a loja) */
  .chat{display:grid; gap:8px; margin-top:12px}
  .bubble{max-width:86%; padding:9px 13px; border-radius:16px; white-space:pre-line; word-wrap:break-word}
  .bubble.me{justify-self:end; background:var(--brand); color:#3d2c00; font-weight:600; border-bottom-right-radius:4px}
  .bubble.app{justify-self:start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px}
  .bubble.sys{justify-self:center; background:var(--surface-2); color:var(--muted); font-size:12px; border-radius:10px; text-align:center}
  .bubble .fix, .bubble .when{font-size:11px; color:var(--muted); margin-top:3px}
  .bubble.me .when{color:#7a5a1a}
  .chatbox{position:sticky; bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom,0px)); background:var(--bg); padding:8px 0 4px}
  .typing{display:inline-flex; gap:3px}
  .typing i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:pisca 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
  @keyframes pisca{0%,100%{opacity:.2}50%{opacity:1}}
  .convo{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer}
  .convo:last-child{border-bottom:0}
  .avatar{width:44px; height:44px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none}
  .rate{display:inline-flex; gap:2px; vertical-align:middle}
  .rate button{border:0; background:none; font-size:24px; line-height:1; padding:0 1px; color:var(--line)}
  .rate button.on{color:var(--brand)}
  .dist{display:grid; gap:6px; margin-top:10px}
  .dist div{display:grid; grid-template-columns:30px 1fr 40px; gap:8px; align-items:center; font-size:13px}
  .bar{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden}
  .bar i{display:block; height:100%; background:var(--brand)}
  .pbar{display:grid; grid-template-columns:90px 1fr 38px; gap:8px; align-items:center; font-size:13px; margin:5px 0}
  /* entrada (cadastro / login) */
  .hero{text-align:center; padding:28px 8px 6px}
  .hero img{width:112px; height:112px; border-radius:28px; box-shadow:0 10px 30px rgba(27,42,74,.15)}
  .hero h1{font-size:28px; margin:14px 0 2px}
  .afil{display:flex; gap:12px; align-items:center; background:linear-gradient(120deg,#fff7ea,#fff); border:1px dashed var(--brand); cursor:pointer}
  .mic{flex:none; width:48px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text);
    display:inline-flex; align-items:center; justify-content:center}
  .mic.ouvindo{background:var(--danger); border-color:var(--danger); color:#fff; animation:pulsar 1s infinite}
  @keyframes pulsar{0%,100%{box-shadow:0 0 0 0 rgba(214,69,69,.5)}50%{box-shadow:0 0 0 8px rgba(214,69,69,0)}}
  .alarme{position:fixed; top:0; left:50%; transform:translateX(-50%); width:min(var(--appw),100%); z-index:50; background:var(--ok); color:#fff; padding:14px 16px; box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .alarme .in{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .alarme b{font-size:17px}
  .alarme .sino{display:inline-block; animation:balanca .6s infinite}
  @keyframes balanca{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
  .toast{position:fixed; left:50%; transform:translateX(-50%); max-width:560px; bottom:calc(var(--tabh) + 78px + env(safe-area-inset-bottom,0px)); z-index:40; width:min(calc(var(--appw) - 32px), calc(100% - 32px))}
  .toast .notice{box-shadow:0 8px 24px rgba(27,42,74,.15); margin:0}
  main.fade{animation:entra .18s ease-out}
  @keyframes entra{from{opacity:.4; transform:translateY(4px)}to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){ .mic.ouvindo,.alarme .sino,main.fade,.typing i{animation:none} }
  /* quadro kanban de pedidos */
  .kanban{display:grid; grid-template-columns:1fr; gap:12px; margin-top:12px}
  @media(min-width:600px){ .kanban{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media(min-width:960px){ .kanban.k4{grid-template-columns:repeat(4,minmax(0,1fr))} .kanban.k3{grid-template-columns:repeat(3,minmax(0,1fr))} .kanban.k5{grid-template-columns:repeat(5,minmax(0,1fr))} }
  .kcol{background:var(--surface-2); border-radius:16px; padding:10px; min-height:90px; border:2px dashed transparent}
  .kcol.over{border-color:var(--brand); background:#fff7ea}
  .kcol h3{margin:2px 4px 8px; font-size:14px; display:flex; align-items:center; justify-content:space-between}
  .kcol h3 .n{background:var(--surface); border-radius:999px; padding:0 9px; font-size:12px}
  .kcard{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:8px; box-shadow:0 1px 2px rgba(27,42,74,.05)}
  .kcard[draggable=true]{cursor:grab}
  .kcard.dragging{opacity:.4}
  .kvazio{color:var(--muted); font-size:12px; text-align:center; padding:14px 0}
  .rolebar{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--surface-2); padding:5px; border-radius:16px}
  .rolebar button{border:0; background:transparent; border-radius:12px; padding:10px 4px; font-weight:800; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:14px}
  .rolebar button .ic{font-size:22px}
  .rolebar button.on{background:var(--navy); color:#fff; box-shadow:0 2px 8px rgba(27,42,74,.25)}
  .rank{display:grid; grid-template-columns:34px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
  .rank:last-child{border-bottom:0}
  .rank .pos{width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:800}
  .rank .sc{font-size:22px; font-weight:800; text-align:right; white-space:nowrap}
  /* v7: ícones de linha, monogramas e fotos */
  .ico{display:inline-block; vertical-align:-4px; flex:none}
  .mono{width:100%; height:100%; border-radius:inherit; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; letter-spacing:.5px}
  .capa{height:110px; display:flex; align-items:center; justify-content:flex-end; padding:0 22px; position:relative}
  .avatar{overflow:hidden; position:relative}
  .thumb.foto{background-size:cover !important; background-position:center !important}
  .thumb .ico{color:rgba(27,42,74,.35)}
  .switch{position:relative; width:46px; height:26px; border-radius:999px; border:0; background:#d9d2c9; flex:none; transition:background .15s}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s}
  .switch.on{background:var(--ok)} .switch.on::after{left:23px}
  .stockrow{display:grid; grid-template-columns:56px 1fr; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
  .stockrow:last-child{border-bottom:0}
  .stockrow .ph{width:56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); background-size:cover; background-position:center; color:rgba(27,42,74,.35)}
  .ctrls{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px}
  .ctrls select{padding:7px 8px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); font:inherit; font-size:13px}
  .ctrls input{width:64px; text-align:center; padding:6px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font:inherit; font-weight:800}
  .ocr-prev{max-width:100%; max-height:280px; border-radius:12px; display:block; margin:10px auto; border:1px solid var(--line)}
  nav.tabbar button .ic{filter:none; opacity:.55}
  nav.tabbar button.on .ic{opacity:1; color:var(--navy)}
  code{background:var(--surface-2); padding:1px 5px; border-radius:6px; font-size:12px}
  .copyrow{display:flex; gap:8px}
  .copyrow input{flex:1; min-width:0; font-size:12px !important; font-family:ui-monospace,monospace}
</style>
</head>

  <div id="alarme"></div>
  <div id="toast" class="toast"></div>
  <main class="wrap" id="app"></main>
</div>

		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		}

	}

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

			if (z < dcdata[s].length) {

			}

function indice(){

  DB.restaurants.forEach(r => r.itens.forEach(i => i.nome.toLowerCase().split(/[^\p{L}]+/u).forEach(w => { const k = stem(norm(w)); if(k && !INDICE.disp.has(k)) INDICE.disp.set(k, w); })));

  if(!out.size && s.length >= 3) vocab.forEach(w => { if(w.startsWith(s)) add(w); });

    if(best){ via = best.w; if(best.sin) SINONIMOS[best.w].forEach(add); else add(best.w); }
  }

function interpretar(q){
  const n = norm(q), f = { termos:[], rotulos:[], quals:[], precoMax:null, ordem:null, promo:false, reset:false };
  if(/\b(limpar|recomecar|outra coisa|nova busca)\b/.test(n)) f.reset = true;
  const pm = n.match(/(?:ate|menos de|max|maximo|abaixo de)\s*(?:r\$|rs)?\s*(\d{1,3})/) || n.match(/(\d{1,3})\s*(?:reais|conto|pila)/);
  if(pm) f.precoMax = +pm[1];
  if(/\bbarat/.test(n)) f.ordem = "preco";
  if(/\b(avaliad|estrela|melhor|melhores|top)\b/.test(n)) f.ordem = "nota";
  if(/\b(promo|desconto|oferta)/.test(n)) f.promo = true;
  q.toLowerCase().split(/\s+/).forEach(orig => {
    const t = norm(orig); if(!t || t.includes(" ") || STOP.has(t) || /^\d+$/.test(t) || IGNORA.test(t)) return;
    const ql = Object.keys(QUALIFICADORES).find(k => QUALIFICADORES[k].w.includes(t));
    if(ql) f.quals.push(ql); else if(t.length >= 3 && !f.termos.includes(t)){ f.termos.push(t); f.rotulos.push(orig.replace(/[^\p{L}\p{N}-]/gu, "")); }
  });
  f.quals = [...new Set(f.quals)]; f.termos = [...new Set(f.termos)];
  return f;
}

    if(via) correcoes.push([t, via]);
    if(k.size) conjuntos.push(k); else faltou.push(t);
  });
  if(conjuntos.length){
    keys = new Set([...conjuntos[0]].filter(k => conjuntos.every(c => c.has(k))));
    if(!keys.size && conjuntos.length > 1){ keys = new Set(conjuntos.flatMap(c => [...c])); amplo = true; }
  }

  f.quals.forEach(q => pares = pares.filter(({i}) => tagsOf(i).includes(q)));
  if(f.precoMax != null) pares = pares.filter(({i}) => precoFinal(i) <= f.precoMax);
  if(f.promo) pares = pares.filter(({i}) => i.desconto > 0);
  const g = new Map();
  pares.forEach(({r,i}) => { if(!g.has(r.id)) g.set(r.id, { r, itens:[] }); g.get(r.id).itens.push(i); });

    x.menor = x.disp.length ? Math.min(...x.disp.map(precoFinal)) : Infinity;
    x.promo = x.disp.some(i => i.desconto);

let BUSCA = { chat:[], filtros:null };
function buscaState(){ return BUSCA; }
function apagarHistoricoBusca(){ BUSCA = { chat:[], filtros:null }; }
function perguntar(q){
  q = (q||"").trim(); if(!q) return;
  const busca = buscaState();
  const f = combinar(busca.filtros, interpretar(q));
  busca.filtros = f; busca.chat = [{ eu:q, em:nowISO() }];
  const { grupos, correcoes, faltou, amplo } = buscar(f);
  const comEstoque = grupos.filter(x => x.disp.length), nItens = comEstoque.reduce((a,x) => a + x.disp.length, 0);
  let txt;
  if(!comEstoque.length){
    txt = grupos.length ? `Os restaurantes que têm ${descreve(f)} estão sem estoque agora.` : `Nenhum restaurante cadastrado tem ${descreve(f)} no cardápio.`;
    txt += " Tente outra palavra ou tire um filtro.";
  } else {
    txt = `${comEstoque.length} ${comEstoque.length===1?"restaurante tem":"restaurantes têm"} ${descreve(f)} — ${nItens} ${nItens===1?"opção":"opções"} no cardápio.`;
    const np = comEstoque.filter(x => x.promo).length; if(np) txt += ` ${np} com promoção.`;
    if(f.ordem) txt += ` Ordenei por ${({preco:"menor preço",nota:"melhor avaliação"})[f.ordem]}.`;
    if(amplo) txt += " Nenhum item tem todas as palavras juntas; mostro quem tem alguma delas.";
  }
  if(faltou.length && comEstoque.length) txt += ` Não achei “${faltou.join(", ")}” em nenhum cardápio.`;
  busca.chat.push({ app:txt, correcoes, grupos:grupos.map(x => ({ rid:x.r.id, ids:x.itens.map(i => i.id) })) });
  go("busca", { limite:20, q0:q });
}

/* =========================================================================
   Pix real — BR Code (padrão EMV do Banco Central), gerado no navegador
   Chave, nome e cidade do restaurante + valor do pedido + txid = código do pedido.
   O QR funciona em qualquer app de banco; a loja confirma o recebimento.
   ========================================================================= */
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++){ c=(c&0x8000)?((c<<1)^0x1021):(c<<1); c&=0xFFFF; } } return c.toString(16).toUpperCase().padStart(4,"0"); }
const tlv = (id, v) => id + String(v.length).padStart(2, "0") + v;
const pixTexto = (s, max) => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim().slice(0, max);
function normalizarChavePix(tipo, chave){
  chave = String(chave || "").trim();
  if(tipo === "email") return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(chave) ? chave.toLowerCase() : null;
  if(tipo === "telefone"){ let d = soDigitos(chave); if(d.startsWith("55") && d.length >= 12) d = d.slice(2); return /^\d{10,11}$/.test(d) ? "+55" + d : null; }
  if(tipo === "cpf"){ const d = soDigitos(chave); return d.length === 11 || d.length === 14 ? d : null; }
  if(tipo === "aleatoria") return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(chave) ? chave.toLowerCase() : null;
  return null;
}
function pixPayload({ chave, nome, cidade, valor, txid, descricao }){
  const gui = tlv("00", "br.gov.bcb.pix") + tlv("01", chave) + (descricao ? tlv("02", pixTexto(descricao, 30)) : "");
  let p = tlv("00","01") + tlv("26", gui) + tlv("52","0000") + tlv("53","986")
        + (valor ? tlv("54", Number(valor).toFixed(2)) : "") + tlv("58","BR")
        + tlv("59", pixTexto(nome, 25) || "RESTAURANTE") + tlv("60", pixTexto(cidade, 15) || "RIO DE JANEIRO")
        + tlv("62", tlv("05", (String(txid || "***").replace(/[^A-Za-z0-9]/g,"").slice(0,25)) || "***"));
  p += "6304";
  return p + crc16(p);
}
function qrSVG(texto, cls="pix-qr"){
  try{
    const q = new QRLib.QRCode(-1, QRLib.ECL.M); q.addData(texto); q.make();
    const n = q.getModuleCount(); let d = "";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg class="${cls}" viewBox="-2 -2 ${n+4} ${n+4}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR Code Pix" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }catch(e){ return `<div class="notice err">Não foi possível desenhar o QR. Use o copia e cola.</div>`; }
}
const aceitaPix = r => !!(r && r.pix && r.pix.chave);
const PAG_LABEL = { aguardando_pagamento:"Aguardando pagamento", informado:"Pagamento enviado — loja confirmando", pago:"Pago ✓",
  a_pagar:"Pagar na retirada", simulado:"Cartão aprovado (simulado)" };
const labelPay = m => ({pix:"Pix", mp:"Mercado Pago", cartao:"Cartão", retirada:"Na retirada"}[m] || m);
// link de pagamento do Mercado Pago colado pela loja (Checkout Pro com valor exato exige back-end: ver blueprint)
const mpValido = u => /^https:\/\/(mpago\.la|mpago\.li|link\.mercadopago\.com\.br|www\.mercadopago\.com\.br)\/\S+$/i.test(String(u||"").trim());
const aceitaMP = r => !!(r && mpValido(r.mpLink));
// CNPJ: confere os dígitos verificadores (validação do cadastro do afiliado)
function cnpjValido(v){ const d = soDigitos(v); if(d.length !== 14 || /^(\d)\1+$/.test(d)) return false;
  const calc = n => { let s = 0, p = n - 7; for(let i=0;i<n;i++){ s += +d[i] * p--; if(p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === +d[12] && calc(13) === +d[13]; }
// matrícula PUC-Rio (ID PUC): 7 dígitos — no piloto, confirmada pelo SSO da PUC (ver README)
const matriculaValida = m => /^\d{7}$/.test(soDigitos(m)) && soDigitos(m).length === String(m).trim().length;
const pagoOk = o => ["pago","simulado"].includes(o.pagamento.status);
function luhn(num){ let s=0, alt=false; for(let i=num.length-1;i>=0;i--){ let d=+num[i]; if(alt){ d*=2; if(d>9) d-=9; } s+=d; alt=!alt; } return s % 10 === 0; }

   WhatsApp — links wa.me com a mensagem pronta (sem servidor).
   Cliente → loja: "quero acompanhar meu pedido". Loja → cliente: status do pedido.

function waNumero(tel){ let d = soDigitos(tel); if(!d) return null; if(d.length <= 11) d = "55" + d; return d.length >= 12 ? d : null; }
const waLink = (tel, txt) => { const n = waNumero(tel); return n ? `https://wa.me/${n}?text=${encodeURIComponent(txt)}` : null; };
const fmtTel = t => { const d = soDigitos(t).replace(/^55(?=\d{10,11}$)/,""); return d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : t; };

/* =========================================================================
   Chat cliente ↔ loja (no app). Conversa por (restaurante, cliente).
   ========================================================================= */
function conversa(restId, username, criar=true){
  const id = restId + "|" + username;
  let c = DB.chats.find(x => x.id === id);
  if(!c && criar){ c = { id, restId, username, msgs:[], lidoCliente:nowISO(), lidoLoja:"1970-01-01T00:00:00.000Z" }; DB.chats.push(c); }
  return c;
}
function enviarMsg(restId, username, de, txt, extra={}){
  txt = String(txt || "").trim(); if(!txt) return;
  const c = conversa(restId, username), agora = nowISO();
  c.msgs.push({ de, txt: txt.slice(0, 600), em: agora, ...extra });
  if(de === "cliente") c.lidoCliente = agora;
  if(de === "loja") c.lidoLoja = agora;
  // resposta automática da loja: uma vez por conversa a cada 6 h, se a loja ainda não respondeu
  const r = getRest(restId);
  if(de === "cliente" && r && r.autoResposta){
    const ultLoja = [...c.msgs].reverse().find(m => m.de === "loja");
    if(!ultLoja || Date.now() - new Date(ultLoja.em) > 6*3600e3)
      c.msgs.push({ de:"loja", auto:true, txt:r.autoResposta, em:new Date(Date.now()+1000).toISOString() });
  }
  save();
}
const naoLidasCliente = c => c.msgs.filter(m => m.de !== "cliente" && m.em > c.lidoCliente).length;
const naoLidasLoja = c => c.msgs.filter(m => m.de === "cliente" && m.em > c.lidoLoja).length;
function totalNaoLidas(){
  if(isCliente()){ const u = currentUser(); return DB.chats.filter(c => c.username === u.username).reduce((a,c) => a + naoLidasCliente(c), 0); }
  if(isDono()){ const r = currentOwnerRest(); return DB.chats.filter(c => c.restId === r.id).reduce((a,c) => a + naoLidasLoja(c), 0); }
  return 0;
}

/* =========================================================================
   Fac — IA de persona. Conversa curta que monta o perfil de gosto.
   Motor local (regras, funciona offline) + Claude opcional (chave do usuário).
   Nunca inventa prato: gostos só viram sugestão se existirem nos cardápios.
   ========================================================================= */
const IA_PERGUNTAS = [
  { k:"gostos", txt:"O que você mais curte comer por aqui? Pode escrever do seu jeito (ex.: “amo sushi e açaí, mas não curto café”).",
    chips:["Sushi / japonês","Lanches","Saudável / fit","Doces e açaí","Café","Almoço caprichado","Fast food"] },
  { k:"restricoes", txt:"Tem algo que você não come ou evita?",
    chips:["Como de tudo","Vegetariano","Sem carne vermelha","Sem frutos do mar","Sem lactose"] },
  { k:"orcamento", txt:"Quanto você costuma gastar numa refeição no campus?", chips:["Até R$ 20","R$ 20 a 35","R$ 35 a 50","Acima de R$ 50"] },
  { k:"momento", txt:"E quando você mais pede? Assim eu sugiro a coisa certa na hora certa.", chips:["Café da manhã","Almoço","Lanche da tarde","Um pouco de tudo"] }
];
const IA_MAPA = [ // palavra → tags de persona
  [/sushi|japa|japones|temaki|sashimi|poke|roll|yakisoba|oriental/, ["japones"]],
  [/lanche|salgado|sanduiche|tapioca|crepe|pao de queijo|quiche|empad/, ["lanche"]],
  [/saudavel|fit|leve|light|grelhad|natural|dieta|proteina/, ["saudavel"]],
  [/salada|bowl|verde/, ["salada","saudavel"]],
  [/doce|acai|brownie|cookie|sobremesa|chocolate|mousse|yogo/, ["doce"]],
  [/cafe|expresso|matte|capuccino|cappuccino|cafezinho/, ["cafe"]],
  [/almoco|prato|comida de verdade|refeicao|caprichad|strogonoff|massa|penne|marmita/, ["prato"]],
  [/fast ?food|hamburg|burger|frit|pizza|besteira|hot/, ["fastfood"]],
];
const GENERICAS = new Set(["prato","lanche","doce","combo","fit","comida","almoco","pedido"]);  // viram peso de persona, não "gosto" concreto
const NEG = /\b(nao|odeio|detesto|evito|sem|nunca|nada de|dispenso)\b/;
const RESTRICOES = { vegetariano:/vegetarian|vegan|nao como carne|sem carne\b/, "sem carne vermelha":/carne vermelha/, "sem frutos do mar":/frutos do mar|peixe|alergi.*(camarao|peixe)/, "sem lactose":/lactose|leite/ };
function evitaDeRestricoes(rs){
  const m = { "vegetariano":["carne","frango","mignon","file","salmao","atum","bacon","peixe","strogonoff"],
              "sem carne vermelha":["carne","mignon","bacon"], "sem frutos do mar":["salmao","sushi","sashimi","temaki","roll","poke","atum"],
              "sem lactose":["queijo","leite","yogo","filadelfia","mousse"] };
  return (rs || []).flatMap(r => m[r] || []);
}
function perfilVazio(){ return { pesos:Object.fromEntries(PK.map(k => [k, 0])), gostos:[], evita:[], restricoes:[], orcamento:null, momento:null, fonte:"local", resumo:"", atualizadoEm:nowISO() }; }
// entende uma frase livre: gostos (+), negações (evitar), restrições, orçamento, momento
function entenderLocal(txt, pf, etapa){
  const n = norm(txt);
  const clausulas = String(txt).toLowerCase().split(/[,;.!?\n]/).map(norm).flatMap(c => c.split(/\b(?:mas|porem|so que|entretanto)\b| e (?=nao |odeio|detesto|evito)/));
  let achou = false;
  clausulas.forEach(cl => {
    cl = cl.trim(); if(!cl) return;
    const neg = NEG.test(cl);
    IA_MAPA.forEach(([re, tags]) => { if(re.test(cl)){ achou = true; tags.forEach(t => pf.pesos[t] = neg ? Math.max(-1, (pf.pesos[t]||0) - .8) : Math.min(1, (pf.pesos[t]||0) + .7)); } });
    // palavras que existem nos cardápios viram gostos/evitar concretos ("salmão", "açaí")
    const { m } = indice();
    cl.split(" ").map(stem).filter(w => w.length >= 4 && !STOP.has(w) && !NEG.test(w)).forEach(w => {
      const alvo = m.has(w) ? w : (SINONIMOS[w] || []).find(s => m.has(s));
      if(alvo && !GENERICAS.has(alvo)){ achou = true; const lista = neg ? pf.evita : pf.gostos; if(!lista.includes(alvo)) lista.push(alvo); }
    });
  });
  Object.entries(RESTRICOES).forEach(([k, re]) => { if(re.test(n) && !/como de tudo/.test(n)){ achou = true; if(!pf.restricoes.includes(k)) pf.restricoes.push(k); } });
  if(/como de tudo|nenhuma|nada nao|sem restric/.test(n) && etapa === "restricoes"){ achou = true; pf.restricoes = []; }
  const pm = n.match(/(\d{2,3})/);
  if(/ate r?\$? ?20\b|barat|economi|pouco/.test(n)){ pf.orcamento = 20; achou = true; }
  else if(/20 a 35|20 e 35|medio/.test(n)){ pf.orcamento = 35; achou = true; }
  else if(/35 a 50|35 e 50/.test(n)){ pf.orcamento = 50; achou = true; }
  else if(/(acima|mais) de r?\$? ?50|tanto faz|sem limite/.test(n)){ pf.orcamento = null; achou = true; if(etapa === "orcamento") pf.orcamentoLivre = true; }
  else if(pm && etapa === "orcamento"){ pf.orcamento = +pm[1]; achou = true; }
  const mom = /cafe da manha|manha/.test(n) ? "manha" : /almoco/.test(n) ? "almoco" : /tarde|lanche da tarde/.test(n) ? "tarde" : /tudo|qualquer/.test(n) ? "tudo" : null;
  if(mom && etapa === "momento"){ pf.momento = mom; achou = true;
    if(mom === "manha"){ pf.pesos.cafe = Math.min(1, pf.pesos.cafe + .4); pf.pesos.lanche = Math.min(1, pf.pesos.lanche + .2); }
    if(mom === "almoco") pf.pesos.prato = Math.min(1, pf.pesos.prato + .4);
    if(mom === "tarde"){ pf.pesos.lanche = Math.min(1, pf.pesos.lanche + .3); pf.pesos.doce = Math.min(1, pf.pesos.doce + .2); } }
  return achou;
}
const bonito = w => indice().disp.get(w) || w;
function resumoPerfil(pf){
  const top = PERSONAS.filter(p => pf.pesos[p.k] > .25).sort((a,b) => pf.pesos[b.k] - pf.pesos[a.k]).slice(0,3).map(p => p.label.toLowerCase());
  const partes = [];
  partes.push(top.length ? `Você curte ${top.join(", ").replace(/, ([^,]*)$/, " e $1")}` : "Você está aberto(a) a tudo");
  if(pf.gostos.length) partes.push(`gosta de ${pf.gostos.slice(0,4).map(bonito).join(", ")}`);
  if(pf.evita.length) partes.push(`evita ${pf.evita.slice(0,4).map(bonito).join(", ")}`);
  if(pf.restricoes.length) partes.push(`restrição: ${pf.restricoes.join(", ")}`);
  if(pf.orcamento) partes.push(`orçamento até ${money(pf.orcamento)}`);
  return partes.join(" · ") + ".";
}
function aplicarPerfil(u, pf){
  pf.atualizadoEm = nowISO(); pf.resumo = resumoPerfil(pf);
  u.perfil = pf;
  const top = PERSONAS.filter(p => pf.pesos[p.k] > .25).map(p => p.k);
  u.persona = top.length ? top : ["saudavel","lanche"];
}
function iaSugestoes(u, n=3){
  const itens = todosItens().filter(x => (x.i.estoque ?? 0) > 0);
  return itens.map(x => ({ ...x, d: combinaDet(x.r, x.i) })).sort((a,b) => b.d.pct - a.d.pct).slice(0, n);
}
// uma rodada da conversa local
function iaLocalResponder(u, txt){
  const ia = u.iaState || (u.iaState = { etapa:0, pf: u.perfil ? JSON.parse(JSON.stringify(u.perfil)) : perfilVazio() });
  const pergunta = IA_PERGUNTAS[ia.etapa];
  const entendeu = entenderLocal(txt, ia.pf, pergunta ? pergunta.k : "livre");
  let resp = "";
  if(!pergunta){ // conversa livre depois do onboarding: ajusta o perfil
    aplicarPerfil(u, ia.pf);
    const s = iaSugestoes(u, 3);
    resp = entendeu ? `Anotado! Atualizei seu perfil: ${u.perfil.resumo}\n\nAgora eu sugiro: ${s.map(x => `${x.i.nome} (${x.r.nome})`).join("; ")}.`
                    : "Não peguei esse gosto 🤔 Tente citar comidas (ex.: “quero algo mais leve”, “não quero mais açaí”).";
    return resp;
  }
  if(!entendeu && pergunta.k === "gostos") return "Hmm, não reconheci nenhuma comida aí. Toque numa das opções ou cite pratos (sushi, salada, açaí, café…).";
  ia.etapa++;
  const prox = IA_PERGUNTAS[ia.etapa];
  const ack = { gostos:"Boa escolha! 😋", restricoes:"Anotado, vou respeitar isso.", orcamento:"Perfeito, vou priorizar o que cabe no bolso.", momento:"Fechou!" }[pergunta.k];
  if(prox) return `${ack} ${prox.txt}`;
  aplicarPerfil(u, ia.pf);
  const s = iaSugestoes(u, 3);
  return `${ack} Montei seu perfil de gosto:\n${u.perfil.resumo}\n\nPra começar, eu pediria: ${s.map(x => `${x.i.nome} no ${x.r.nome} (${x.d.pct}% combina)`).join("; ")}.\n\nPode continuar conversando para ajustar (ex.: “essa semana quero algo leve”).`;
}
// Claude opcional: usa a chave que o próprio usuário colou em Perfil (fica só neste aparelho)
async function iaClaudeResponder(u, txt){
  const p = prefs();
  const vocab = [...new Set(todosItens().map(x => x.i.nome))].slice(0, 160).join("; ");
  const sistema = `Você é a Fac, assistente de gosto do FaculFood (restaurantes do campus da PUC-Rio, só retirada no balcão). Converse em português, curto e simpático (máx. 3 frases), e descubra os gostos do estudante: comidas favoritas, o que evita, restrições, orçamento e horário. Nunca invente prato: só cite itens desta lista de cardápios: ${vocab}.
Responda SOMENTE com JSON válido: {"resposta": string, "pesos": {"saudavel":n,"fastfood":n,"salada":n,"lanche":n,"doce":n,"cafe":n,"japones":n,"prato":n}, "gostos": [palavras simples de comida], "evita": [palavras], "restricoes": [de "vegetariano","sem carne vermelha","sem frutos do mar","sem lactose"], "orcamento": número ou null}. Pesos entre -1 e 1. Restrição só se o estudante disser.`;
  const hist = (u.iaChat || []).slice(-12).map(m => ({ role: m.eu != null ? "user" : "assistant", content: m.eu != null ? m.eu : m.ia }));
  if(hist.length && hist[0].role !== "user") hist.shift();
  const atual = u.perfil ? `Perfil atual: ${JSON.stringify({ pesos:u.perfil.pesos, gostos:u.perfil.gostos, evita:u.perfil.evita, restricoes:u.perfil.restricoes, orcamento:u.perfil.orcamento })}` : "Sem perfil ainda.";
  const msgs = [...hist.filter((m,k) => !(k === hist.length-1 && m.role === "user" && m.content === txt)), { role:"user", content: `${atual}\nEstudante: ${txt}` }];
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":p.claudeKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model: p.claudeModel || "claude-haiku-4-5", max_tokens: 600, system: sistema, messages: msgs })
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const texto = (data.content || []).map(c => c.text || "").join("");
  const j = JSON.parse(texto.slice(texto.indexOf("{"), texto.lastIndexOf("}") + 1));
  const pf = u.perfil ? JSON.parse(JSON.stringify(u.perfil)) : perfilVazio();
  PK.forEach(k => { if(typeof j.pesos?.[k] === "number") pf.pesos[k] = Math.max(-1, Math.min(1, j.pesos[k])); });
  const { m } = indice();
  const soCardapio = arr => (arr || []).map(w => stem(norm(w))).filter(w => m.has(w) || (SINONIMOS[w]||[]).some(s => m.has(s)));
  pf.gostos = [...new Set(soCardapio(j.gostos))]; pf.evita = [...new Set(soCardapio(j.evita))];
  pf.restricoes = (j.restricoes || []).filter(r => r in RESTRICOES);
  pf.orcamento = typeof j.orcamento === "number" ? j.orcamento : null;
  pf.fonte = "claude";
  aplicarPerfil(u, pf);
  u.iaState = { etapa: IA_PERGUNTAS.length, pf: JSON.parse(JSON.stringify(pf)) };
  return String(j.resposta || "Anotado!");
}

const FILTROS_CANDIDATOS = ["salmão","hambúrguer","açaí","café","frango","temaki","tapioca","strogonoff","salada","pão de queijo","sushi","wrap"];
function filtrosMaisUsados(){
  const cont = new Map(FILTROS_CANDIDATOS.map((f, k) => [f, { n:0, k }]));

// horários de retirada com capacidade por restaurante (evita gargalo no balcão)
function pickupSlots(r){
  const out = [], d = new Date(), cap = r.capacidadeSlot || 8;
  d.setMinutes(d.getMinutes() + 20);
  d.setMinutes(Math.ceil(d.getMinutes()/15)*15, 0, 0);
  const ocup = new Map();
  DB.orders.filter(o => o.restId === r.id && o.status !== "cancelado").forEach(o => ocup.set(o.retiradaISO, (ocup.get(o.retiradaISO) || 0) + 1));
  for(let i=0;i<12;i++){
    const iso = d.toISOString(), n = ocup.get(iso) || 0;
    out.push({ iso, label:(i===0?"Assim que possível — ":"") + hora(iso), n, cap, cheio: n >= cap });
    d.setMinutes(d.getMinutes()+15);
  }
  return out;
}

/* ---------- RESTAURANTE: RESULTADOS (itens mais pedidos, horário de pico, avaliações) ---------- */
function viewOwnerResultados(){
  const r = currentOwnerRest(), dias = view.dias || 7;
  const desde = Date.now() - dias * 864e5;
  const ped = DB.orders.filter(o => o.restId === r.id && o.status !== "cancelado" && +new Date(o.criadoEm) >= desde);
  const fat = ped.reduce((a,o) => a + o.total, 0);
  // itens mais pedidos (quantidade)
  const porItem = new Map();
  ped.forEach(o => o.itens.forEach(l => { const x = porItem.get(l.nome) || { nome:l.nome, qty:0, fat:0 }; x.qty += l.qty; x.fat += l.qty * l.preco; porItem.set(l.nome, x); }));
  const top = [...porItem.values()].sort((a,b) => b.qty - a.qty).slice(0, 8), maxQ = Math.max(1, ...top.map(t => t.qty));
  // horário de pico: pedidos por hora de retirada (quando o cliente vem ao balcão)
  const horas = Array.from({ length:14 }, (_, k) => 7 + k), porHora = horas.map(h => ped.filter(o => new Date(o.retiradaISO).getHours() === h).length);
  const maxH = Math.max(1, ...porHora), pico = horas[porHora.indexOf(Math.max(...porHora))];
  const aval = ped.filter(o => o.notaPedido), mediaPed = aval.length ? aval.reduce((a,o) => a + o.notaPedido, 0) / aval.length : 0;
  const { media, total } = notaDe(r), d = r.avaliacoes || [0,0,0,0,0], maxD = Math.max(1, ...d);
  const comentarios = DB.orders.filter(o => o.restId === r.id && (o.comentario || o.notaPedido) && !o.demo).slice(-6).reverse();
  const kpi = (l, v) => `<div class="card" style="padding:12px"><div class="muted xs">${l}</div><b style="font-size:20px">${v}</b></div>`;
  return `
  <div class="seg" style="max-width:420px">${[[7,"7 dias"],[30,"30 dias"],[3650,"Tudo"]].map(([n,l]) => `<button class="${dias===n?"on":""}" data-act="res-dias" data-d="${n}">${l}</button>`).join("")}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
    ${kpi("Pedidos", ped.length)}${kpi("Faturamento", money(fat))}${kpi("Ticket médio", ped.length ? money(fat / ped.length) : "—")}${kpi("Nota dos pedidos", aval.length ? "★ " + mediaPed.toFixed(1).replace(".",",") : "—")}
  </div>
  <div class="rgrid" style="margin-top:14px">
    <div class="card">
      <b>Itens mais pedidos</b>
      ${top.length ? `<div style="margin-top:10px">${top.map((t, k) => `<div class="pbar" style="grid-template-columns:minmax(0,1.3fr) 1fr 44px" title="${esc(t.nome)}: ${t.qty} un. · ${money(t.fat)}">
        <span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${k+1}. ${esc(t.nome)}</span>
        <span class="bar" style="height:12px"><i style="width:${t.qty/maxQ*100}%;border-radius:0 4px 4px 0;background:${k === 0 ? "var(--brand-d)" : "var(--brand)"}"></i></span>
        <span class="small" style="text-align:right;font-weight:700">${t.qty}</span></div>`).join("")}</div>`
        : `<div class="empty" style="padding:20px 0">Sem pedidos no período.</div>`}
    </div>
    <div class="card">
      <div class="between"><b>Horário de pico</b>${ped.length ? `<span class="chip low">pico às ${pico}h</span>` : ""}</div>
      <div class="muted xs">Pedidos por horário de retirada</div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:140px;margin-top:10px;border-bottom:1px solid var(--line)" role="img" aria-label="Pedidos por hora de retirada; pico às ${pico} horas">
        ${porHora.map((n, k) => `<div title="${horas[k]}h: ${n} pedidos" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%">
          ${n && horas[k] === pico ? `<span class="xs" style="font-weight:800">${n}</span>` : ""}
          <div style="width:100%;height:${n/maxH*100}%;min-height:${n ? 3 : 0}px;border-radius:4px 4px 0 0;background:${horas[k] === pico ? "var(--brand-d)" : "#f7c46a"}"></div></div>`).join("")}
      </div>
      <div style="display:flex;gap:3px">${horas.map(h => `<span class="xs muted" style="flex:1;text-align:center">${h % 2 ? "" : h}</span>`).join("")}</div>
    </div>
  </div>
  <h2>Avaliações</h2>
  <div class="rgrid">
    <div class="card">
      <div class="muted xs">Nota do restaurante</div>
      <div style="font-size:34px;font-weight:800"><span class="stars">★</span> ${total ? media.toFixed(1).replace(".",",") : "—"}</div>
      <div class="muted xs">${total} avaliações</div>
      <div class="dist">${[5,4,3,2,1].map(n => `<div><span>${n}★</span><span class="bar"><i style="width:${d[n-1]/maxD*100}%"></i></span><span class="muted">${d[n-1]}</span></div>`).join("")}</div>
    </div>
    <div class="card">
      <b>Comentários recentes</b>
      ${comentarios.length ? comentarios.map(o => `<div class="kv small" style="display:block"><div class="between"><span>${esc(o.username)}</span>
          <span class="xs">Loja <span class="stars">${"★".repeat(o.nota || 0)}</span> · Pedido <span class="stars">${"★".repeat(o.notaPedido || 0)}</span></span></div>
          ${o.comentario ? `<div class="muted">“${esc(o.comentario)}”</div>` : ""}</div>`).join("")
        : '<div class="empty" style="padding:20px 0">Sem comentários ainda.</div>'}
    </div>
  </div>`;
}

/* =========================================================================
   PAINEL PUC-RIO — validação de afiliados, engajamento (concessão), gargalo
   ========================================================================= */
function metricas(r){
  const ped = DB.orders.filter(o => o.restId === r.id), validos = ped.filter(o => o.status !== "cancelado");
  const fat = validos.reduce((a,o) => a + o.total, 0);
  const concl = validos.length ? validos.filter(o => o.status === "retirado").length / validos.length : 0;
  // tempo de resposta no chat: da mensagem do aluno até a primeira resposta humana da loja
  const tempos = [];
  DB.chats.filter(c => c.restId === r.id).forEach(c => {
    let aberto = null;
    c.msgs.forEach(m => { if(m.de === "cliente" && !aberto) aberto = m.em; else if(m.de === "loja" && !m.auto && aberto){ tempos.push((new Date(m.em) - new Date(aberto)) / 60000); aberto = null; } });
  });
  const resp = tempos.length ? tempos.reduce((a,b) => a+b, 0) / tempos.length : null;
  const ultAtual = Math.max(0, ...r.itens.map(i => +new Date(i.atualizadoEm || 0)));
  const diasCard = ultAtual ? (Date.now() - ultAtual) / 864e5 : 99;
  const promo = r.itens.some(i => i.ativo && i.desconto);
  const { media, total } = notaDe(r);
  const score = Math.round(Math.min(1, validos.length / 20) * 30 + (total ? media / 5 : .6) * 20 + (resp == null ? 7 : resp <= 10 ? 15 : resp <= 60 ? 8 : 2)
    + (diasCard <= 7 ? 15 : diasCard <= 30 ? 8 : 0) + (promo ? 10 : 0) + (validos.length ? concl * 10 : 5));
  return { pedidos:validos.length, cancelados:ped.length - validos.length, fat, concl, resp, diasCard, promo, media, total, score };
}

/* ---------- Carrinho: começa em 0, + adiciona 1 ---------- */
function addToCart(rest, item, qty=1){
  if(!visivel(rest)){ toast("warn", `${rest.nome} não está recebendo pedidos agora.`); return render(); }
  if(cart.restId && cart.restId !== rest.id){
    toast("warn", `Seu carrinho tinha itens de ${getRest(cart.restId).nome}. Começamos um pedido novo em ${rest.nome}.`);
    cart = { restId:null, lines:[] };
  }
  cart.restId = rest.id;
  const line = cart.lines.find(l => l.itemId === item.id);
  const cabe = Math.max(0, (item.estoque ?? 0) - (line ? line.qty : 0));
  if(cabe <= 0){ toast("warn", `Só há ${item.estoque ?? 0} unidade(s) de “${item.nome}”.`); return render(); }
  const add = Math.min(qty, cabe);
  if(line) line.qty += add;
  else cart.lines.push({ itemId:item.id, nome:item.nome, preco:precoFinal(item), qty:add, obs:"" });
  render();
}
function changeQty(itemId, delta){
  const l = cart.lines.find(x => x.itemId === itemId);
  if(!l) return;
  l.qty += delta;
  if(l.qty <= 0) cart.lines = cart.lines.filter(x => x.itemId !== itemId);
  if(cart.lines.length === 0) cart.restId = null;
  render();
}

/* ---------- Busca por áudio ---------- */
let reconhecendo = null;
function iniciarVoz(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const input = document.getElementById("askInput");
  if(!SR){ toast("warn","Este navegador não tem reconhecimento de voz. Use Chrome, Edge ou Safari, ou digite."); return; }
  if(reconhecendo){ try{ reconhecendo.stop(); }catch(e){} return; }
  const rec = new SR(); reconhecendo = rec;
  rec.lang = "pt-BR"; rec.interimResults = true; rec.maxAlternatives = 1;
  btn.classList.add("ouvindo"); input.value = ""; input.placeholder = "Ouvindo… o que comer agora?";
  let enviado = false;
  rec.onresult = e => {
    const txt = [...e.results].map(r => r[0].transcript).join("");
    input.value = txt;
    if(e.results[e.results.length - 1].isFinal && !enviado){ enviado = true; rec.stop(); perguntar(txt); }
  };
  rec.onerror = e => {
    toast("warn", { "not-allowed":"O microfone foi bloqueado. Permita o acesso ao microfone no navegador.", "service-not-allowed":"O microfone foi bloqueado.",
      "no-speech":"Não ouvi nada. Toque no microfone e fale de novo.", "audio-capture":"Nenhum microfone encontrado." }[e.error] || "Não deu para ouvir agora. Tente de novo ou digite.");
    enviado = true;
  };
  rec.onend = () => { reconhecendo = null; document.querySelectorAll(".mic").forEach(b => b.classList.remove("ouvindo")); };
  try{ rec.start(); }catch(e){ reconhecendo = null; btn.classList.remove("ouvindo"); }
}

/* ---------- Alarme: pedido pronto (aluno) e pedido novo (restaurante) ---------- */
const alarme = { ctx:null, timer:null, pedido:null };
function destravarSom(){ try{ alarme.ctx = alarme.ctx || new (window.AudioContext || window.webkitAudioContext)(); if(alarme.ctx.state === "suspended") alarme.ctx.resume(); }catch(e){} }
document.addEventListener("pointerdown", destravarSom);
function bip(notas=[880,1175,880]){
  const c = alarme.ctx; if(!c) return;
  notas.forEach((f, k) => {
    const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + k*.28;
    o.type = "square"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.25, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + .24);
  });
}
function notificar(titulo, corpo){ try{ if("Notification" in window && Notification.permission === "granted") new Notification(titulo, { body:corpo, icon:"assets/icon-192.png" }); }catch(e){} }
function tocarAlarme(o){
  const r = getRest(o.restId);
  alarme.pedido = o.id; bip();
  try{ navigator.vibrate && navigator.vibrate([400,200,400,200,600]); }catch(e){}
  clearInterval(alarme.timer); let n = 0;
  alarme.timer = setInterval(() => { bip(); try{ navigator.vibrate && navigator.vibrate(300); }catch(e){} if(++n >= 20) pararAlarme(); }, 2500);
  notificar("FaculFood: seu pedido está pronto!", `#${o.codigo} no balcão do ${r ? r.nome : "restaurante"}.`);
  renderAlarme();
}
function pararAlarme(){ clearInterval(alarme.timer); alarme.timer = null; alarme.pedido = null; renderAlarme(); }
// alarme de pedido pronto: tela cheia, som repetido, vibração e notificação
function renderAlarme(){
  const el = document.getElementById("alarme"); if(!el) return;
  const o = alarme.pedido === "teste" ? { codigo:"TESTE1", restId:null } : alarme.pedido && DB.orders.find(x => x.id === alarme.pedido), r = o && getRest(o.restId);
  el.innerHTML = o ? `<div class="alarme-full" role="alertdialog" aria-live="assertive" aria-label="Pedido pronto">
      <div class="sino">${ICON("bell",96)}</div>
      <h1>Seu pedido está pronto!</h1>
      <div>${r ? `${esc(r.nome)} · retire no balcão` : "Teste do alarme"}</div>
      <div class="cod">${o.codigo}</div>
      <button class="btn lg" style="background:#fff;color:#17683b;border-color:#fff" data-act="ver-pedido">Ver pedido</button>
      <button class="btn lg ghost" style="color:#fff;border-color:rgba(255,255,255,.6)" data-act="parar-alarme">Parar alarme</button>

// ao marcar "Pronto": abre o WhatsApp do cliente com a mensagem pronta (se ele pediu aviso)
function avisarProntoWhats(o, auto){
  const r = getRest(o.restId), u = userBy(o.username);
  if(o.status !== "pronto"){ toast("ok", `#${o.codigo} → ${STATUS_LABEL[o.status]}`); return; }
  const link = u && u.telefone && (o.whatsAviso || u.whatsAvisos) ? waLink(u.telefone, msgLojaParaCliente(o)) : null;
  if(!link){ toast("ok", `#${o.codigo} pronto. O app do cliente tocou o alarme.`); return; }
  let aberto = null;
  if(auto && r.waAuto !== false){ try{ aberto = window.open(link, "_blank"); if(aberto) aberto.opener = null; }catch(e){} }
  o.whatsEnviado = nowISO(); logEvento("whatsapp","Aviso de pronto enviado","#" + o.codigo, o.restId); save();
  toast("ok", aberto === null && auto && r.waAuto !== false ? `#${o.codigo} pronto. Toque em WhatsApp no cartão para avisar o cliente.` : `#${o.codigo} pronto. WhatsApp aberto para avisar ${o.username}.`, 5000);
}

/* ---------- Fotos: reduzir no navegador antes de guardar ---------- */
function reduzirImagem(file, max, q){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image();
      im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q)); };
      im.onerror = () => rej(new Error("Não consegui abrir essa imagem.")); im.src = fr.result; };
    fr.onerror = () => rej(new Error("Não consegui ler o arquivo.")); fr.readAsDataURL(file);
  });
}

// texto do OCR → itens: "Nome ........ 12,90"; linhas sem preço viram categoria (maiúsculas/curtas) ou subtítulo do item anterior
function parseCardapio(texto){
  const itens = []; let cat = "";
  String(texto || "").split(/\n+/).map(l => l.replace(/\s+/g, " ").trim()).filter(l => l.length > 1).forEach(l => {
    const m = l.match(/^(.*?)[\s.·…_:-]*(?:R\s?\$\s*)?(\d{1,3}(?:[.,]\d{2}))\s*(?:reais)?$/i);
    if(m && m[1].replace(/[^A-Za-zÀ-ú]/g, "").length >= 2){
      let nome = m[1].replace(/[.·…_:-]+$/,"").replace(/\b(a partir de|apartir de)\b/i, "").trim();
      nome = nome.charAt(0).toUpperCase() + nome.slice(1).toLowerCase().replace(/\b(\d+)\s?(pc|pç|pcs|und|ml)\b/g, "$1$2");
      itens.push({ nome:nome.slice(0,60), sub:"", preco:m[2].replace(".", ","), categoria:cat || "Cardápio" });
    } else if(/^[A-ZÀ-Ú0-9 &/()-]{3,40}$/.test(l) || (l.length <= 28 && !/[a-z]{3,}.*\s[a-z]{3,}.*\s[a-z]{3,}/.test(l) && !itens.length)){
      cat = l.charAt(0).toUpperCase() + l.slice(1).toLowerCase();
    } else if(itens.length && !itens.at(-1).sub){
      itens.at(-1).sub = l.slice(0, 90);
    }
  });
  return itens;
}
// Cardápios reais costumam ter 2–3 colunas (NOME em maiúsculas / preço à direita / descrição embaixo).
// Esta função usa as coordenadas do PDF para separar colunas e parear nome ↔ preço ↔ descrição.
function extrairItensPdfPagina(items, W){
  const its = items.filter(i => i.str && i.str.trim()).map(i => ({ x:i.transform[4], y:i.transform[5], s:i.str.trim() }));
  if(!its.length) return [];
  const temMinuscula = s => /[a-zà-ú]{3}/.test(s);
  const ehCaps = s => /[A-ZÀ-Ú]/.test(s) && !temMinuscula(s);   // título de item costuma vir em CAIXA ALTA
  // divide a página em nCol colunas iguais, lê cada uma de cima p/ baixo e pareia NOME / preço / descrição
  function parseCom(nCol){
    const largura = W / nCol, itens = [];
    for(let c = 0; c < nCol; c++){
      const col = its.filter(i => Math.min(nCol - 1, Math.floor(i.x / largura)) === c), byY = {};
      col.forEach(i => { const y = Math.round(i.y / 5) * 5; (byY[y] = byY[y] || []).push(i); });
      const rows = Object.keys(byY).sort((a, b) => b - a).map(y => byY[y].sort((a, b) => a.x - b.x).map(r => r.s).join(" ").replace(/\s+/g, " ").trim());
      let cur = null;
      for(const txt of rows){
        const pm = txt.match(/R\$\s*(\d+[.,]\d{2})/), semP = txt.replace(/R\$\s*\d+[.,]\d{2}/g, "").trim();
        if(ehCaps(semP) && semP.replace(/[^A-Za-zÀ-ú]/g, "").length >= 3){
          cur = { nome:semP.slice(0, 60), preco: pm ? pm[1].replace(".", ",") : "", sub:"", categoria:"Cardápio" };
          itens.push(cur);
        } else if(pm && cur && !cur.preco){ cur.preco = pm[1].replace(".", ","); if(semP && temMinuscula(semP)) cur.sub = (cur.sub ? cur.sub + " " : "") + semP; }
        else if(cur && temMinuscula(semP) && semP.length > 3 && cur.sub.length < 90){ cur.sub = (cur.sub ? cur.sub + " " : "") + semP; }
      }
    }
    return itens.filter(i => i.preco && i.nome.length > 2);
  }
  // escolhe o nº de colunas com mais itens de NOME LIMPO (nome curto). Colunas erradas mesclam textos e geram nomes longos.
  let melhor = [], melhorScore = -1;
  for(const n of [1, 2, 3]){ const r = parseCom(n), score = r.filter(i => i.nome.length <= 38).length; if(score > melhorScore){ melhorScore = score; melhor = r; } }
  return melhor.map(i => ({ nome:i.nome, preco:i.preco, sub:(i.sub || "").slice(0, 90), categoria:i.categoria }));
}
function carregarScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("sem internet")); document.head.appendChild(s); }); }
async function lerComOCR(img){
  if(!window.Tesseract){
    try{ await carregarScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"); }
    catch(e){ throw new Error("Precisa de internet só da primeira vez, para carregar o leitor de texto (OCR). Conecte-se e tente de novo."); }
  }
  const { data } = await window.Tesseract.recognize(img, "por");
  return data.text;
}
// dedup de itens lidos: mesmo nome+preço entra uma vez só
function dedupItens(itens){
  const vistos = new Set();
  return itens.filter(x => { if(!x || !x.nome || !x.preco) return false; const k = norm(x.nome) + "|" + String(x.preco); if(vistos.has(k)) return false; vistos.add(k); return true; });
}
// carrega o pdf.js (uma vez) de CDN; precisa de internet
async function carregarPdfLib(){
  if(window.pdfjsLib) return window.pdfjsLib;
  const base = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
  try{ await carregarScript(base + "pdf.min.js"); }
  catch(e){ throw new Error("Precisa de internet para abrir PDFs (carregar o leitor de PDF). Conecte-se e tente de novo."); }
  if(!window.pdfjsLib) throw new Error("Não consegui carregar o leitor de PDF.");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
  return window.pdfjsLib;
}
// rasteriza uma página do PDF para imagem (com timeout de segurança)
async function renderPaginaPdf(page){
  const vp = page.getViewport({ scale: 2 });
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
  const tarefa = page.render({ canvasContext: c.getContext("2d"), viewport: vp });
  await Promise.race([ tarefa.promise, new Promise((_, rej) => setTimeout(() => { try{ tarefa.cancel(); }catch(e){} rej(new Error("render-timeout")); }, 20000)) ]);
  return c.toDataURL("image/jpeg", .85);
}
// PDF -> { texto (linhas por página), itens (estruturados por coluna), paginas (imagens só das escaneadas), numPaginas }
async function processarPDF(file){
  const lib = await carregarPdfLib();
  const dados = new Uint8Array(await file.arrayBuffer());
  const pdf = await lib.getDocument({ data: dados }).promise;
  const limite = Math.min(pdf.numPages, 10);   // segurança: até 10 páginas
  const paginas = []; let texto = ""; const itens = [];
  for(let p = 1; p <= limite; p++){
    leitura.fase = `Lendo o PDF… (página ${p} de ${limite})`; render();
    const page = await pdf.getPage(p);
    let txtPagina = "";
    try{
      const tc = await page.getTextContent();
      // (a) itens estruturados por coluna, usando as coordenadas (bom p/ cardápios desenhados em 2–3 colunas)
      itens.push(...extrairItensPdfPagina(tc.items, page.getViewport({ scale:1 }).width));
      // (b) texto linear por linha (reserva, p/ o parser simples de "Nome .... preço")
      const linhas = {};
      tc.items.forEach(it => { if(!it.str) return; const y = Math.round(it.transform[5]); (linhas[y] = linhas[y] || []).push(it.str); });
      txtPagina = Object.keys(linhas).sort((a, b) => b - a).map(y => linhas[y].join(" ")).join("\n");
    }catch(e){}
    texto += "\n" + txtPagina;
    // só rasteriza a página (p/ Claude Vision ou OCR) se o texto digital for insuficiente — PDF escaneado/desenhado
    if(txtPagina.replace(/\s/g, "").length < 20){
      try{ paginas.push(await renderPaginaPdf(page)); }catch(e){}
    }
  }
  return { texto, itens, paginas, numPaginas: pdf.numPages };
}
async function lerCardapio(){
  leitura.lendo = true; leitura.erro = ""; leitura.fase = "Lendo o cardápio…"; render();
  try{
    // Leitura 100% offline e gratuita (não usa nenhuma API paga): texto do PDF ou OCR local da imagem.
    let itens = [];
    // 1) PDF com texto digital: itens estruturados por coluna (nome + preço + descrição)
    if(leitura.itensPdf && leitura.itensPdf.length){ itens = dedupItens(leitura.itensPdf); leitura.fonte = "lido do PDF (texto)"; }
    // 1b) senão, parser linear simples do texto ("Nome .... preço")
    if(!itens.length && leitura.textoPdf && leitura.textoPdf.replace(/\s/g, "").length > 40){
      itens = parseCardapio(leitura.textoPdf); if(itens.length) leitura.fonte = "lido do PDF (texto)";
    }
    // 2) senão (foto, ou PDF escaneado): OCR local gratuito (Tesseract) em cada página/imagem
    if(!itens.length){
      const pgs = (leitura.paginas && leitura.paginas.length) ? leitura.paginas : (leitura.img ? [leitura.img] : []);
      if(!pgs.length) throw new Error("Envie uma foto ou PDF do cardápio primeiro.");
      for(let i = 0; i < pgs.length; i++){
        leitura.fase = pgs.length > 1 ? `Lendo página ${i + 1} de ${pgs.length}…` : "Lendo o cardápio…"; render();
        itens.push(...parseCardapio(await lerComOCR(pgs[i])));
      }
      leitura.fonte = (leitura.tipo === "pdf" ? "PDF " : "") + "lido por OCR";
    }
    itens = dedupItens(itens);
    if(!itens.length) throw new Error("Não encontrei itens com preço. Tente um PDF com texto selecionável, ou uma foto mais reta, próxima e bem iluminada.");
    leitura.itens = itens.map(x => ({ ...x, ok:true }));
    logEvento("cardapio", "Leu cardápio", `${itens.length} itens (${leitura.fonte})`, currentOwnerRest().id); save();
  }catch(e){ leitura.erro = e.message; }
  leitura.lendo = false; leitura.fase = ""; render();
}

  if(it){ const antes = it.preco; Object.assign(it, dados); tagsOf(it);

    toast("ok", `“${nome}” salvo.`); }
  else { const novo = { id:uid(), ...dados }; tagsOf(novo); r.itens.push(novo);
    logEvento("cardapio","Adicionou item", `${nome} · ${money(preco)}`, r.id); toast("ok", `“${nome}” adicionado ao cardápio.`); }
  itemFotoTmp = null; save(); voltar(); if(view.name !== "owner-menu") aba("owner-menu");
}
function handleLote(fd){
  const r = currentOwnerRest(), linhas = String(fd.get("lote")||"").split(/\n/).map(l => l.trim()).filter(Boolean);
  const novos = [], erros = [];
  linhas.forEach((l, k) => {
    const p = l.split(/\s*[;\t|]\s*/);
    let nome = p[0], sub = "", preco, cat = "";
    if(p.length === 2){ preco = precoNum(p[1]); } else { sub = p[1] || ""; preco = precoNum(p[2]); cat = p[3] || ""; }
    if(!nome || !(preco > 0 && preco <= 500)){ erros.push(k+1); return; }
    if(r.itens.concat(novos).some(i => norm(i.nome) === norm(nome))){ erros.push(k+1); return; }
    const it = { id:uid(), nome:nome.slice(0,60), sub:sub.slice(0,90), preco, categoria:cat || "Cardápio", obs:null, ativo:true, estoque:ESTOQUE_INICIAL, desconto:0, atualizadoEm:nowISO() };
    tagsOf(it); novos.push(it);
  });
  if(!novos.length){ toast("err", "Nenhuma linha válida. Formato: Título ; Subtítulo ; Preço ; Categoria"); return; }
  r.itens.push(...novos); logEvento("cardapio","Adicionou itens em lote", `${novos.length} itens`, r.id); save();
  toast(erros.length ? "warn" : "ok", `${novos.length} itens adicionados.` + (erros.length ? ` Linhas ignoradas: ${erros.join(", ")} (preço inválido ou título repetido).` : ""), 6000);
  aba("owner-menu");
}
function handleLoja(fd){
  const r = currentOwnerRest(), erro = m => toast("err", m);
  const nome = String(fd.get("nome")||"").trim(), wa = waNumero(fd.get("whatsapp")), cap = +fd.get("capacidadeSlot");
  if(nome.length < 3) return erro("Nome muito curto.");
  if(String(fd.get("whatsapp")||"").trim() && !wa) return erro("WhatsApp inválido.");
  if(!Number.isInteger(cap) || cap < 1 || cap > 50) return erro("Capacidade: de 1 a 50 pedidos a cada 15 min.");
  const chave = String(fd.get("pixChave")||"").trim();
  let pix = null;
  if(chave){ const tipo = String(fd.get("pixTipo")); const ch = normalizarChavePix(tipo, chave); if(!ch) return erro("Chave Pix não confere com o tipo.");
    pix = { tipo, chave:ch, nome:String(fd.get("pixNome")||nome).trim() || nome, cidade:"RIO DE JANEIRO", demo: r.pix && r.pix.demo && r.pix.chave === ch }; }
  const mp = String(fd.get("mpLink")||"").trim(); if(mp && !mpValido(mp)) return erro("Link do Mercado Pago inválido.");
  setPrefs({ claudeKey:String(fd.get("claudeKey") || "").trim() });
  Object.assign(r, { nome, local:String(fd.get("local")||"").trim(), whatsapp:wa, capacidadeSlot:cap, autoResposta:String(fd.get("autoResposta")||"").trim(), pix, mpLink:mp || null, waAuto:!!fd.get("waAuto") });
  logEvento("loja","Atualizou dados da loja", `Pix ${pix ? "sim" : "não"} · MP ${mp ? "sim" : "não"} · capacidade ${cap}`, r.id);
  save(); toast("ok","Dados da loja salvos."); render();
}
function mudarStatus(o, novo, por){
  const r = getRest(o.restId), antes = o.status;
  if(antes === novo) return;
  if(novo === "cancelado" && !["cancelado","retirado"].includes(antes))   // estoque volta
    o.itens.forEach(l => { const it = r.itens.find(i => i.id === l.itemId); if(it) it.estoque = (it.estoque ?? 0) + l.qty; });
  o.status = novo; o.historico = o.historico || []; o.historico.push({ status:novo, em:nowISO(), por });
  if(novo === "pronto") o.alarmeTocado = false;
  enviarMsg(o.restId, o.username, "sistema", STATUS_MSG[novo](o));
  logEvento("pedido", `Pedido ${STATUS_LABEL[novo].toLowerCase()}`, `#${o.codigo} (${por})`, o.restId);
  save();
}
function finalizarPedido(){
  // avaliação obrigatória: não deixa pedir de novo enquanto houver pedido retirado sem nota
  const pend = pedidosPendentesAvaliacao();
  if(pend.length){ toast("warn", "Avalie seu pedido anterior antes de pedir de novo."); go("avaliar-pedido", { orderId: pend[0].id }); return; }
  const u = currentUser(), r = getRest(cart.restId);
  const pay = view.pay || (aceitaPix(r) ? "pix" : aceitaMP(r) ? "mp" : "retirada");
  const slot = document.getElementById("slot")?.value;
  if(!visivel(r)){ toast("err", `${r.nome} pausou os pedidos agora.`); return render(); }
  const s = pickupSlots(r).find(x => x.iso === slot);
  if(!s || s.cheio){ toast("err","Esse horário lotou. Escolha outro."); return render(); }
  for(const l of cart.lines){
    const it = r.itens.find(i => i.id === l.itemId);
    if(!it || !it.ativo || it.preco == null){ toast("err",`“${l.nome}” ficou indisponível. Tire do carrinho.`); return render(); }
    if(l.qty > (it.estoque ?? 0)){ toast("err", `“${l.nome}”: só restam ${it.estoque ?? 0}. Ajuste a quantidade.`); return render(); }
    l.preco = precoFinal(it);
  }
  let pagamento;
  if(pay === "cartao"){
    const num = (document.getElementById("cc-num").value||"").replace(/\s/g,""), exp = document.getElementById("cc-exp").value||"", cvv = document.getElementById("cc-cvv").value||"";
    const [mm, aa] = exp.split("/").map(Number), agora = new Date();
    if(!/^\d{13,19}$/.test(num) || !luhn(num)){ toast("err","Número de cartão inválido (teste: 4111 1111 1111 1111)."); return; }
    if(!(mm >= 1 && mm <= 12) || (2000 + aa) * 12 + mm < agora.getFullYear() * 12 + agora.getMonth() + 1){ toast("err","Validade inválida ou vencida (MM/AA)."); return; }
    if(!/^\d{3,4}$/.test(cvv)){ toast("err","CVV inválido."); return; }
    pagamento = { metodo:"cartao", status:"simulado", final:num.slice(-4) };
  } else if(pay === "pix"){ if(!aceitaPix(r)) return toast("err","Esta loja não aceita Pix."); pagamento = { metodo:"pix", status:"aguardando_pagamento" }; }
  else if(pay === "mp"){ if(!aceitaMP(r)) return toast("err","Esta loja não tem Mercado Pago."); pagamento = { metodo:"mp", status:"aguardando_pagamento" }; }
  else pagamento = { metodo:"retirada", status:"a_pagar" };
  // aviso no WhatsApp quando ficar pronto
  const querAviso = !!document.getElementById("waAviso")?.checked, telNovo = soDigitos(document.getElementById("waTel")?.value);
  if(querAviso && !u.telefone){ if(!/^\d{10,13}$/.test(telNovo)){ toast("err","Informe seu WhatsApp com DDD para receber o aviso."); return; } u.telefone = telNovo; }
  if(querAviso) u.whatsAvisos = true;
  destravarSom();   // libera o som do alarme neste aparelho
  try{ if("Notification" in window && Notification.permission === "default") Notification.requestPermission(); }catch(e){}
  const order = { id:uid(), codigo:uniqueCode(r.id), restId:r.id, username:u.username,
    itens:cart.lines.map(l => ({ itemId:l.itemId, nome:l.nome, preco:l.preco, qty:l.qty, obs:l.obs || null })),
    total:Math.round(cartTotal()*100)/100, pagamento, status:"aguardando", whatsAviso: querAviso && !!u.telefone, retiradaISO:slot, criadoEm:nowISO(), historico:[{ status:"aguardando", em:nowISO(), por:"cliente" }] };
  cart.lines.forEach(l => {
    const it = r.itens.find(i => i.id === l.itemId);
    it.estoque = Math.max(0, (it.estoque ?? 0) - l.qty);
    // persona aprende com o pedido
    if(u.perfil) tagsOf(it).forEach(t => { if(t in u.perfil.pesos) u.perfil.pesos[t] = Math.min(1, u.perfil.pesos[t] + .1); });
    else { const ps = persona(); tagsOf(it).forEach(t => { if(PK.includes(t) && !ps.includes(t)) ps.push(t); }); }
  });
  if(u.perfil){ u.perfil.resumo = resumoPerfil(u.perfil); }
  DB.orders.push(order);
  if(pagamento.status === "simulado"){ order.status = "fila"; order.historico.push({ status:"fila", em:nowISO(), por:"pagamento" }); }
  enviarMsg(r.id, u.username, "sistema", `🧾 Pedido #${order.codigo} enviado: ${order.itens.map(i => i.qty + "× " + i.nome).join(", ")} · ${money(order.total)} · retirada ${hora(slot)}.`);
  logEvento("pedido","Novo pedido", `#${order.codigo} · ${money(order.total)} · ${labelPay(pay)}`, r.id);
  save();
  cart = { restId:null, lines:[] };
  if(pay === "mp"){ try{ window.open(r.mpLink, "_blank", "noopener"); }catch(e){} }
  pilhaVoltar = []; go("pedido-ok", { orderId: order.id });
}
function uniqueCode(restId){
  let c; const usados = new Set(DB.orders.filter(o=>o.restId===restId).map(o=>o.codigo));
  do { c = pickupCode(); } while(usados.has(c));
  return c;
}
